{% extends "base.html" %}
{% load tailwind_filters %}

{% block titulo %}Actualizar Producto{% endblock titulo %}

{% block contenido %}
  <h1>Actualizar Producto</h1>
  <form method="post" action="{% url 'update_producto' producto.id %}" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form|crispy }}
    <button class="my-4 rounded bg-blue-600 p-2 text-white hover:bg-blue-700"
            type="submit">
      Guardar
    </button>
  </form>
{% endblock %}
