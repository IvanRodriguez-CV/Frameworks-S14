{% extends "base.html" %}
{% load tailwind_filters %}

{% block titulo %}Registro | Catálogo comercial{% endblock %}

{% block contenido %}
  <form method="post" action="{% url 'registrar_usuario' %}" class="w-96 mt-10">
    {% csrf_token %}
    {{ form|crispy }}
    <button type="submit" class="p-2 my-4 bg-blue-600 text-white hover:bg-blue-700 rounded">
      Guardar
    </button>
  </form>
{% endblock %}
