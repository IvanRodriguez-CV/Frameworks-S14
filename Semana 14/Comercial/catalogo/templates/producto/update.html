{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}Editar producto | Catálogo comercial{% endblock %}

{% block contenido %}
  <section class="mx-auto max-w-2xl rounded-xl bg-white p-6 shadow-sm sm:p-8">
    <h1 class="text-2xl font-bold text-slate-900">Editar producto</h1>
    <p class="mb-6 mt-1 text-slate-600">{{ producto.nombre }}</p>
    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}
      {% crispy form %}
      <div class="mt-4">
        <a class="text-slate-600 hover:underline" href="{% url 'list_productos' %}">
          Volver al listado
        </a>
      </div>
    </form>
  </section>
{% endblock %}
