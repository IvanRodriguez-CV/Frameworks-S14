<nav class="flex flex-wrap items-center gap-4" aria-label="Navegación principal">
  <a class="font-semibold text-indigo-700 hover:text-indigo-900" href="{% url 'inicio' %}">
    Catálogo comercial
  </a>
  {% if user.is_authenticated %}
    <a class="text-slate-600 hover:text-indigo-700" href="{% url 'home' %}">Inicio</a>
    {% if user.is_superuser or user.rol.nombre == "Administrador" %}
      <a class="text-slate-600 hover:text-indigo-700" href="{% url 'list_categorias' %}">
        Categorías
      </a>
      <a class="text-slate-600 hover:text-indigo-700" href="{% url 'list_productos' %}">
        Productos
      </a>
    {% endif %}
    <span class="text-sm text-slate-500">
      {{ user.get_full_name|default:user.username }}
      ({{ user.rol.nombre }})
    </span>
    <form method="post" action="{% url 'logout' %}">
      {% csrf_token %}
      <button class="text-slate-600 hover:text-indigo-700" type="submit">
        Cerrar sesión
      </button>
    </form>
  {% else %}
    <a class="text-slate-600 hover:text-indigo-700" href="{% url 'login' %}">
      Iniciar sesión
    </a>
    <a class="text-slate-600 hover:text-indigo-700" href="{% url 'registrar_usuario' %}">
      Registrarse
    </a>
  {% endif %}
</nav>
